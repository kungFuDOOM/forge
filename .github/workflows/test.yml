name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Built-in self-tests
        run: |
          python forge_core.py
          python forge_runtime.py
          python forge_offline_bench.py
      - name: Install and smoke-test the forge command
        run: |
          pip install .
          cd "$RUNNER_TEMP"
          forge init smoke --template http -o smoke.forge
          forge check smoke.forge
          forge examples basic-calculator
          forge spec
